<meta name="theme-color" content="#0b57d0">
<style>
:root{--bg:#e9ece6;--panel:#f7f8f4;--ink:#1d2320;--muted:#5d675f;--line:#cbd2c8;--accent:#d6246e;--ai:#fff;--cell:#dfe3da;--ok:#1f7a3d;--mid:#a86400;--bad:#c0262d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a17;--panel:#1f2622;--ink:#e8ece6;--muted:#9aa59c;--line:#34403a;--accent:#ff5c9d;--ai:#1a0710;--cell:#c9cec5;--ok:#58d17f;--mid:#f0b04a;--bad:#ff7a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a17;--panel:#1f2622;--ink:#e8ece6;--muted:#9aa59c;--line:#34403a;--accent:#ff5c9d;--ai:#1a0710;--cell:#c9cec5;--ok:#58d17f;--mid:#f0b04a;--bad:#ff7a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Familjen Grotesk",system-ui,sans-serif}
h1{font-size:22px;margin:0 0 2px;font-weight:700}
small,.sub{color:var(--muted)}
#app{max-width:1150px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:340px 1fr}
@media (max-width:860px){#app{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;align-content:start}
label{display:grid;gap:4px;font-weight:500;font-size:13px;color:var(--muted)}
select,input[type=number],input[type=file]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px;cursor:pointer;background:var(--accent);color:var(--ai)}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hit{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.hit b{font-size:19px}.hit small{display:block;margin-top:2px}
.stage{display:flex;justify-content:center;padding:8px 0}
#pv{position:relative;box-shadow:0 2px 14px rgba(0,0,0,.25);overflow:hidden;background:#fff}
#pvIn{transform-origin:0 0}
.sheet{position:relative;background:#fff;overflow:hidden}
.cell{position:absolute;background:var(--cell);overflow:hidden}
.cut .cell{outline:.15mm solid rgba(0,0,0,.4);outline-offset:-.1mm}
.cell img{width:100%;height:100%;display:block}
.it{display:grid;grid-template-columns:42px 1fr 56px 32px;gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.it.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.it img{width:42px;height:42px;object-fit:cover;border-radius:4px}
.it span{font-size:12px;color:var(--muted)}
.it input{padding:5px}.it .x{padding:4px;background:transparent;color:var(--muted);font-size:18px}
#list{display:grid;gap:6px}
#ed{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:10px}
#fr{position:relative;overflow:hidden;margin:0 auto;background:var(--cell);touch-action:none;cursor:grab;outline:2px solid var(--line)}
#fr img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.b{font-weight:700;font-size:13px}.b.ok{color:var(--ok)}.b.mid{color:var(--mid)}.b.bad{color:var(--bad)}
#pageRule{display:none}
#printWrap{display:none}
@media print{html{padding:0}body{background:#fff}#app{display:none}#printWrap{display:block}}
</style>
</head>

  <label class="chk"><input type="checkbox" id="cut" checked> Garis potong di tiap foto</label>
  <label>Printer kecil: pecah jadi beberapa lembar (PDF)<select id="tile"><option value="0">Tidak, satu halaman</option><option value="A4">Pecah ke lembar A4</option><option value="A3">Pecah ke lembar A3</option></select></label>
  <button id="go">Cetak</button>
  <button class="alt" id="pdfb" hidden>Simpan PDF</button>
  <small id="msg2"></small>
  <button class="alt" id="theme">Ganti tema terang/gelap</button>
</div>
<div>
  <div class="hit" id="hit"></div>
  <div class="stage"><div id="pv"><div id="pvIn"></div></div></div>
</div>
</div>
<div id="printWrap"></div>
<style id="pageRule"></style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const PAPERS={A0:[841,1189],A1:[594,841],A2:[420,594],A3:[297,420],A4:[210,297],A5:[148,210],A6:[105,148],A7:[74,105],A8:[52,74],Letter:[216,279],F4:[215,330],Kustom:null};
const PHOTOS={A1:[594,841],A2:[420,594],A3:[297,420],A4:[210,297],A5:[148,210],A6:[105,148],A7:[74,105],A8:[52,74],"2R":[64,89],"3R":[89,127],"4R":[102,152],"5R":[127,178],"6R":[152,203],"8R":[203,254],"10R":[254,305],"Pas foto 2×3 cm":[20,30],"Pas foto 3×4 cm":[30,40],"Pas foto 4×6 cm":[40,60],Kustom:null};
const $=id=>document.getElementById(id),tick=()=>new Promise(r=>setTimeout(r,40));
let photos=[],sel=0,dl=null;
function fill(s,o,d){s.innerHTML=Object.keys(o).map(k=>`<option value="${k}"${k===d?" selected":""}>${k}${o[k]?` (${o[k][0]}×${o[k][1]} mm)`:""}</option>`).join("")}
fill($("paper"),PAPERS,"A1");fill($("photo"),PHOTOS,"A7");
const load=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
const toBlob=c=>new Promise(r=>c.toBlob(r,"image/jpeg",.95));
async function mkPhoto(b){const url=URL.createObjectURL(b),el=await load(url),o={url,el,w:el.naturalWidth,h:el.naturalHeight};return{...o,z:1,px:50,py:50,qty:1,o}}
async function rebake(p,b){if(p.url!==p.o.url)URL.revokeObjectURL(p.url);const url=URL.createObjectURL(b),el=await load(url);Object.assign(p,{url,el,w:el.naturalWidth,h:el.naturalHeight})}
function dims(){let P=[...(PAPERS[$("paper").value]||[+$("pw").value||210,+$("ph").value||297])];const F=[...(PHOTOS[$("photo").value]||[+$("fw").value||40,+$("fh").value||60])];if(($("orient").value==="l")!==(P[0]>P[1]))P.reverse();return{P,F}}
function grid(P,F,m,g){return{cols:Math.max(0,Math.floor((P[0]-2*m+g+1e-6)/(F[0]+g))),rows:Math.max(0,Math.floor((P[1]-2*m+g+1e-6)/(F[1]+g))),w:F[0],h:F[1]}}
function layout(){
  const{P,F}=dims(),m=Math.max(0,+$("margin").value||0),g=Math.max(0,+$("gap").value||0);
  let a=grid(P,F,m,g),rot=false;
  if($("auto").checked){const b=grid(P,[F[1],F[0]],m,g);if(b.cols*b.rows>a.cols*a.rows){a=b;rot=true}}
  const cap=a.cols*a.rows,k=photos.length;let S=[];
  if(!k)S=Array(cap).fill(-1);
  else if($("qty").value==="max"){const base=Math.floor(cap/k),rem=cap%k;photos.forEach((_,i)=>{for(let j=0;j<base+(i<rem?1:0);j++)S.push(i)})}
  else photos.forEach((p,i)=>{for(let j=0;j<p.qty;j++)S.push(i)});
  S=S.slice(0,cap);
  const uw=a.cols*a.w+(a.cols-1)*g,uh=a.rows*a.h+(a.rows-1)*g;
  return{P,F,m,g,a,rot,cap,S,x0:(P[0]-uw)/2,y0:(P[1]-uh)/2}
}
const cxy=(L,i)=>[L.x0+(i%L.a.cols)*(L.a.w+L.g),L.y0+Math.floor(i/L.a.cols)*(L.a.h+L.g)];
function dpiOf(p,a,fit=$("fit").value){const cw=a.w,ch=a.h,sx=cw/p.w,sy=ch/p.h,s=fit==="cover"?Math.max(sx,sy):fit==="contain"?Math.min(sx,sy):(sx+sy)/2;return 25.4*p.z/s}
const imgStyle=(p,fit)=>`object-fit:${fit};object-position:${p.px}% ${p.py}%;transform:scale(${p.z});transform-origin:${p.px}% ${p.py}%`;
function sheetHTML(L){
  const fit=$("fit").value;
  let h=`<div class="sheet${$("cut").checked?" cut":""}" style="width:${L.P[0]}mm;height:${L.P[1]}mm">`;
  L.S.forEach((si,i)=>{const[x,y]=cxy(L,i),p=photos[si];
    h+=`<div class="cell" style="left:${x}mm;top:${y}mm;width:${L.a.w}mm;height:${L.a.h}mm">${p?`<img src="${p.url}" alt="" style="${imgStyle(p,fit)}">`:""}</div>`});
  return h+"</div>"
}
function render(){
  const L=layout(),{P,F,a,rot,cap,S}=L,fit=$("fit").value;
  $("customPaper").hidden=$("paper").value!=="Kustom";$("customPhoto").hidden=$("photo").value!=="Kustom";
  const pn=$("paper").value==="Kustom"?`${P[0]}×${P[1]} mm`:$("paper").value,fn=$("photo").value==="Kustom"?`${F[0]}×${F[1]} mm`:$("photo").value;
  if(!cap)$("hit").innerHTML=`<b>Tidak muat</b><small>Ukuran foto ${fn} lebih besar dari area kertas ${pn}. Kurangi margin atau pilih ukuran lain.</small>`;
  else{
    let w="";const used=[...new Set(S)].filter(i=>i>=0);
    if(used.length){const d=Math.min(...used.map(i=>dpiOf(photos[i],a)));w=` Ketajaman terendah ${Math.round(d)} DPI (${d>=250?"tajam":d>=150?"cukup":"akan tampak pecah, perbesar dulu"}).`}
    const sh=+$("margin").value<5?" Printer rumahan biasanya butuh margin minimal 5 mm.":"";
    $("hit").innerHTML=`<b>${fn} di ${pn}: ${a.cols} kolom × ${a.rows} baris = ${cap} foto</b><small>${rot?"Foto diputar 90° agar lebih banyak muat. ":""}Dicetak ${S.length} foto.${w}${sh}</small>`}
  const pxmm=96/25.4,k=Math.min(1,Math.min($("pv").parentElement.clientWidth-8,760)/(P[0]*pxmm));
  $("pv").style.width=P[0]*pxmm*k+"px";$("pv").style.height=P[1]*pxmm*k+"px";$("pvIn").style.transform=`scale(${k})`;$("pvIn").innerHTML=sheetHTML(L);
  const p=photos[sel];$("ed").hidden=!p;
  if(p&&cap){
    const fw=Math.min(240,260*a.w/a.h),fh=fw*a.h/a.w;
    Object.assign($("fr").style,{width:fw+"px",height:fh+"px"});
    $("fi").src=p.url;$("fi").style.cssText=imgStyle(p,fit);$("zm").value=p.z;
    const d=dpiOf(p,a),c=d>=250?"ok":d>=150?"mid":"bad";
    $("dpi").className="b "+c;$("dpi").textContent=`${Math.round(d)} DPI pada ukuran cetak: ${c==="ok"?"tajam":c==="mid"?"cukup":"akan tampak pecah"} (${p.w}×${p.h} px)`}
}
function ui(){
  $("list").innerHTML=photos.map((p,i)=>`<div class="it${i===sel?" on":""}" data-i="${i}"><img src="${p.url}" alt=""><span>Foto ${i+1}<br>${p.w}×${p.h}px</span><input type="number" min="0" value="${p.qty}" data-q="${i}" aria-label="Jumlah foto ${i+1}"><button class="x" data-d="${i}" aria-label="Hapus foto ${i+1}">×</button></div>`).join("")||"<small>Belum ada foto. Kotak abu-abu di bawah adalah pratinjau kosong.</small>";
  render()
}
$("list").addEventListener("click",e=>{const d=e.target.closest("[data-d]");
  if(d){const i=+d.dataset.d;URL.revokeObjectURL(photos[i].url);photos.splice(i,1);sel=Math.max(0,Math.min(sel,photos.length-1));ui();return}
  const it=e.target.closest("[data-i]");if(it&&!e.target.closest("input")){sel=+it.dataset.i;ui()}});
$("list").addEventListener("input",e=>{if(e.target.dataset.q!==undefined){photos[+e.target.dataset.q].qty=Math.max(0,+e.target.value||0);render()}});
$("file").addEventListener("change",async e=>{for(const f of e.target.files)photos.push(await mkPhoto(f));if(e.target.files.length)sel=photos.length-1;e.target.value="";ui()});
["paper","orient","photo","pw","ph","fw","fh","margin","gap","fit","qty","auto","cut"].forEach(id=>{$(id).addEventListener("input",render);$(id).addEventListener("change",render)});
$("zm").addEventListener("input",()=>{photos[sel].z=+$("zm").value;render()});
async function rot(d){const p=photos[sel];if(!p)return;const c=document.createElement("canvas");c.width=p.h;c.height=p.w;const x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(d*Math.PI/2);x.drawImage(p.el,-p.w/2,-p.h/2);await rebake(p,await toBlob(c));ui()}
$("rl").onclick=()=>rot(-1);$("rr").onclick=()=>rot(1);
$("rs").onclick=()=>{const p=photos[sel];if(!p)return;if(p.url!==p.o.url)URL.revokeObjectURL(p.url);Object.assign(p,p.o,{z:1,px:50,py:50});ui()};
function sharpen(c,a=.4){const x=c.getContext("2d"),w=c.width,h=c.height,im=x.getImageData(0,0,w,h),d=im.data,s=w*4,pr=new Uint8ClampedArray(s),cu=new Uint8ClampedArray(s);cu.set(d.subarray(0,s));
  for(let y=1;y<h-1;y++){const r=y*s;pr.set(cu);cu.set(d.subarray(r,r+s));for(let i=4;i<s-4;i++){if((i&3)===3)continue;d[r+i]=cu[i]*(1+4*a)-a*(cu[i-4]+cu[i+4]+pr[i]+d[r+s+i])}}
  x.putImageData(im,0,0)}
$("upb").onclick=async()=>{
  const p=photos[sel],L=layout();if(!p||!L.cap)return;
  let f=$("upf").value;f=f==="auto"?Math.min(8,Math.max(1,250/dpiOf(p,L.a))):+f;
  f=Math.min(f,Math.sqrt(25e6/(p.w*p.h)));
  if(f<1.05){$("msg").textContent="Foto sudah cukup tajam atau sudah mencapai batas ukuran (sekitar 25 megapiksel).";return}
  $("msg").textContent="Memproses, mohon tunggu…";await tick();
  const TW=Math.round(p.w*f),TH=Math.round(p.h*f);let W=p.w,src=p.el;
  while(W<TW){const nw=Math.min(TW,W*2),nh=Math.round(nw*TH/TW),c=document.createElement("canvas");c.width=nw;c.height=nh;const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(src,0,0,nw,nh);src=c;W=nw}
  sharpen(src);await rebake(p,await toBlob(src));$("msg").textContent=`Selesai: ${p.w}×${p.h} px.`;ui()};
let dr=null;const fr=$("fr");
fr.onpointerdown=e=>{const p=photos[sel];if(p){dr={x:e.clientX,y:e.clientY,px:p.px,py:p.py};fr.setPointerCapture(e.pointerId)}};
fr.onpointermove=e=>{if(!dr)return;const p=photos[sel],w=fr.clientWidth,h=fr.clientHeight,f=$("fit").value;if(f==="fill")return;
  const sc=f==="cover"?Math.max(w/p.w,h/p.h):Math.min(w/p.w,h/p.h),sx=(p.z*(w-p.w*sc)-(p.z-1)*w)/100,sy=(p.z*(h-p.h*sc)-(p.z-1)*h)/100,cl=v=>Math.max(0,Math.min(100,v));
  if(Math.abs(sx)>.01)p.px=cl(dr.px+(e.clientX-dr.x)/sx);if(Math.abs(sy)>.01)p.py=cl(dr.py+(e.clientY-dr.y)/sy);render()};
fr.onpointerup=fr.onpointercancel=()=>{dr=null};
function doPrint(){const L=layout();if(!L.cap){alert("Ukuran foto tidak muat di kertas.");return}
  $("printWrap").innerHTML=sheetHTML(L);$("pageRule").textContent=`@media print{@page{size:${L.P[0]}mm ${L.P[1]}mm;margin:0}}`;setTimeout(()=>window.print(),100)}
$("go").onclick=doPrint;
function cellJPG(p,cw,ch,fit){
  const dpi=Math.min(300,Math.max(100,dpiOf(p,{w:cw,h:ch},fit)));let W=cw/25.4*dpi,H=ch/25.4*dpi;const k=Math.min(1,7000/Math.max(W,H));W=Math.round(W*k);H=Math.round(H*k);
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.imageSmoothingQuality="high";
  const sx=W/p.w,sy=H/p.h,s=fit==="cover"?Math.max(sx,sy):fit==="contain"?Math.min(sx,sy):0,dw=fit==="fill"?W:p.w*s,dh=fit==="fill"?H:p.h*s,ox=fit==="fill"?0:(W-dw)*p.px/100,oy=fit==="fill"?0:(H-dh)*p.py/100,Ox=W*p.px/100,Oy=H*p.py/100;
  x.beginPath();x.rect(0,0,W,H);x.clip();x.translate(Ox,Oy);x.scale(p.z,p.z);x.translate(-Ox,-Oy);x.drawImage(p.el,ox,oy,dw,dh);
  return c.toDataURL("image/jpeg",.92)}
$("pdfb").onclick=async()=>{
  const L=layout();if(!L.cap||!window.jspdf){$("msg2").textContent="PDF belum bisa dibuat (ukuran tidak muat atau pustaka PDF gagal dimuat).";return}
  $("msg2").textContent="Membuat PDF…";await tick();
  try{
    const fit=$("fit").value,{P,a}=L,img={};
    L.S.forEach(i=>{if(i>=0&&!img[i])img[i]=cellJPG(photos[i],a.w,a.h,fit)});
    let T=P,nx=1,ny=1;const o=10,t=$("tile").value;
    if(t!=="0"){const B=t==="A4"?[210,297]:[297,420];let best=null;
      [[B[0],B[1]],[B[1],B[0]]].forEach(c=>{const X=Math.max(1,Math.ceil((P[0]-o)/(c[0]-o))),Y=Math.max(1,Math.ceil((P[1]-o)/(c[1]-o)));if(!best||X*Y<best.X*best.Y)best={c,X,Y}});
      if(P[0]<=B[0]&&P[1]<=B[1]||P[0]<=B[1]&&P[1]<=B[0]){T=P}else{T=best.c;nx=best.X;ny=best.Y}}
    const fm=(W,H)=>[Math.min(W,H),Math.max(W,H)],or=(W,H)=>W>H?"l":"p";
    const doc=new jspdf.jsPDF({unit:"mm",format:fm(T[0],T[1]),orientation:or(T[0],T[1])});
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
      if(i||j)doc.addPage(fm(T[0],T[1]),or(T[0],T[1]));
      const ox=i*(T[0]-o),oy=j*(T[1]-o);
      L.S.forEach((si,n)=>{const[cx,cy]=cxy(L,n),x=cx-ox,y=cy-oy;if(x>T[0]||y>T[1]||x+a.w<0||y+a.h<0)return;
        if(si>=0)doc.addImage(img[si],"JPEG",x,y,a.w,a.h,"p"+si);else{doc.setFillColor(223,227,218);doc.rect(x,y,a.w,a.h,"F")}
        if($("cut").checked){doc.setDrawColor(120);doc.setLineWidth(.1);doc.rect(x,y,a.w,a.h)}});
      if(nx*ny>1){doc.setFontSize(7);doc.setTextColor(214,36,110);doc.text(`Baris ${j+1}, kolom ${i+1}`,3,4)}}
    if(dl)await dl.save({filename:"cetak-foto.pdf",data:doc.output("blob")});else doc.save("cetak-foto.pdf");$("msg2").textContent=`PDF ${nx*ny} halaman siap.`
  }catch(e){$("msg2").textContent=e&&e.code==="declined"?"Penyimpanan dibatalkan.":"Gagal membuat PDF. Coba kurangi ukuran kertas atau jumlah foto."}};
$("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=getComputedStyle(r).colorScheme==="dark"?"light":"dark"};
window.addEventListener("resize",render);
ui();
if(window.jspdf)$("pdfb").hidden=false;
try{window.claude&&claude.use("downloads").then(d=>{dl=d;if(d)$("pdfb").hidden=false}).catch(()=>{})}catch(e){}
</script>
</body>
</html>
